<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helpdesk Anywhere Admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="logo"><span class="logo-mark" aria-hidden="true">HA</span><span><strong>Helpdesk Anywhere</strong><small>Admin portal</small></span></div>
    <nav id="nav" aria-label="Admin sections">
      <a href="#/overview" data-route="overview" data-perm="dashboard.view">Overview</a>
      <a href="#/agents" data-route="agents" data-perm="users.read">Agents &amp; access</a>
      <a href="#/live" data-route="live" data-perm="sessions.read">Live sessions</a>
      <a href="#/history" data-route="history" data-perm="sessions.read">Session history</a>
      <a href="#/reports" data-route="reports" data-perm="reports.export">Reports</a>
      <a href="#/audit" data-route="audit" data-perm="audit.read">Audit trail</a>
      <a href="#/settings" data-route="settings" data-perm="dashboard.view">Settings</a>
    </nav>
    <div class="who">
      <div id="who-name" class="who-name">…</div>
      <div id="who-role" class="who-role"></div>
      <button id="sign-out" type="button" class="btn btn-quiet">Sign out</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button id="menu" type="button" class="btn btn-quiet menu" aria-controls="sidebar" aria-expanded="false">Menu</button>
      <h1 id="page-title">Overview</h1>
      <span id="dev-badge" class="badge badge-warn" hidden>Development sign-in</span>
    </header>
    <div id="flash" class="flash" role="status" hidden></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<script src="/app.js" type="module"></script>
</body>
</html>
